name: LLM DOM Integrity Check

on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dom-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dom:
    strategy:
      fail-fast: false
      matrix:
        channel: [chromium, chrome]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Install stable Chrome
        if: matrix.channel == 'chrome'
        uses: browser-actions/setup-chrome@v1
      - name: Record browser versions
        env:
          BROWSER_CHANNEL: ${{ matrix.channel }}
        run: |
          echo "### Browser matrix: $BROWSER_CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Playwright: $(bunx playwright --version)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BROWSER_CHANNEL" = "chrome" ]; then
            google-chrome --version >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Browser: Playwright-managed Chromium" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Start virtual display
        run: Xvfb :99 -screen 0 1280x720x24 &
      - name: Set display
        run: echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Restore authenticated Playwright state
        id: auth-state
        env:
          PLAYWRIGHT_AUTH_STATE_B64: ${{ secrets.PLAYWRIGHT_AUTH_STATE_B64 }}
        run: |
          if [ -z "$PLAYWRIGHT_AUTH_STATE_B64" ]; then
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "No authenticated Playwright state configured; running public-page checks."
            exit 0
          fi
          mkdir -p playwright/.auth
          printf '%s' "$PLAYWRIGHT_AUTH_STATE_B64" | base64 --decode > playwright/.auth/storageState.json
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: bun run test:unit
      - name: Build extension
        run: bun run build
      - name: Run DOM Assertion Tests
        env:
          PLAYWRIGHT_CHANNEL: ${{ matrix.channel == 'chrome' && 'chrome' || 'chromium' }}
        run: bun run test:dom
      - name: Upload Playwright report on failure
        if: ${{ failure() && steps.auth-state.outputs.authenticated != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.channel }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore