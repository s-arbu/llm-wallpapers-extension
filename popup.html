<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Wallpapers Settings</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }

    .dashboard {
      width: 100%;
      max-width: 480px;
      padding: 32px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    header { margin-bottom: 32px; text-align: center; }
    .brand-mark { width: 64px; height: 64px; display: block; margin: 0 auto 16px; }
    h1 { margin: 0 0 8px 0; font-size: 24px; font-weight: 600; }
    p { margin: 0; color: var(--text-muted); font-size: 14px; }

    .section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    /* File Upload Row */
    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; display: inline-block; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); display: none; }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border); text-decoration: none; display: inline-block; }
    .btn-secondary:hover { background: var(--border); }

    .file-name {
      flex-grow: 1;
      font-size: 14px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Slider Controls */
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .val-display { color: var(--accent); font-weight: 500; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <header>
      <img class="brand-mark" src="logo.svg" alt="">
      <h1>LLM Wallpapers</h1>
      <p>Configure your workspace background</p>
    </header>

    <div class="section">
      <div class="section-title">Background Source</div>
      <div class="file-row">
        <!-- The label acts as the button, triggering the hidden input -->
        <label for="imageInput" class="btn btn-primary">Choose File</label>
        <input type="file" id="imageInput" accept="image/*,.gif,.png,.jpg,.jpeg,.webp" hidden>
        
        <div class="file-name" id="fileNameDisplay">No file chosen</div>
        <button id="resetBtn" class="btn btn-danger">Remove</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Visual Effects</div>
      <div class="field">
        <div class="label-row">
          <label>Opacity</label>
          <span class="val-display" id="opacityVal">15%</span>
        </div>
        <input type="range" id="opacityInput" min="0.05" max="1" step="0.05">
      </div>
      
      <div class="field">
        <div class="label-row">
          <label>Blur Radius</label>
          <span class="val-display" id="blurVal">0px</span>
        </div>
        <input type="range" id="blurInput" min="0" max="20" step="1">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Support</div>
      <a class="btn btn-secondary" href="https://github.com/s-arbu/llm-wallpapers-extension/issues/new" target="_blank" rel="noopener noreferrer">Report an issue</a>
    </div>
  </div>

  <script type="module" src="src/popup/popup.ts"></script>
</body>
</html>
